<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden}svg{display:block}</style>
<!--
  Play Store icon, 512x512. Same artwork as the installed launcher icon
  (res/drawable/ic_launcher_background.xml + ic_launcher_foreground.xml), rendered through
  the adaptive-icon safe zone: the source canvas is 108 units, of which only the inner 72
  are guaranteed visible, so viewBox="14 14 80 80" makes the shield sit at exactly the size
  a launcher draws it. Full square and fully opaque — Play applies its own rounding.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="14 14 80 80">
  <defs>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="54" cy="42" r="72">
      <stop offset="0" stop-color="#2A2015"/>
      <stop offset="1" stop-color="#0E1116" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="27" y1="24" x2="81" y2="86">
      <stop offset="0" stop-color="#F0D79A"/>
      <stop offset="0.45" stop-color="#C79A46"/>
      <stop offset="1" stop-color="#8C6A2C"/>
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="80" height="80" fill="#0E1116"/>
  <rect x="14" y="14" width="80" height="80" fill="url(#bg)"/>

  <!-- shield body -->
  <path d="M54,24 L81,33.5 L81,54.5 C81,70 69.5,80.5 54,86.5 C38.5,80.5 27,70 27,54.5 L27,33.5 Z" fill="url(#brass)"/>
  <!-- inner bevel -->
  <path d="M54,29.5 L76,37.3 L76,54.5 C76,67.3 66.6,76.1 54,81.2 C41.4,76.1 32,67.3 32,54.5 L32,37.3 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2"/>
  <!-- keyhole -->
  <circle cx="54" cy="44" r="6.5" fill="#0E1116"/>
  <path d="M50.6,49 L57.4,49 L59.4,66 L48.6,66 Z" fill="#0E1116"/>
</svg>
