<!doctype html><meta charset="utf-8">
<!--
  Screenshot 1 — the unlock challenge (ui/lock/LockGate.kt, PIN branch + ui/lock/PinKeypad.kt).

  Sizes below are the .dp values from those two files: 28dp horizontal padding, a 72dp icon
  box with a 20dp radius and a 1dp outline, 14dp PIN dots spaced 14dp (unfilled ones at
  0.7 scale), and a 3-wide keypad of aspectRatio(1.4) keys with 10dp gaps whose fourth row
  is [fingerprint, tenth digit, backspace]. Hint text is challengeHint()'s default branch.

  The app being locked is drawn as a generic photo glyph on purpose — a real third-party
  launcher icon in a store listing is someone else's trademark.
-->
<link rel="stylesheet" href="shared.css">
<style>
  /* No bottom bar on this screen, so it gets a taller panel and the caption moves up. */
  .cap { top: 58px; }
  .panel { top: 200px; height: 1671px; }
  .ui { height: 698px; }

  .body { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 28px; }
  .appbox {
    width: 72px; height: 72px; border-radius: 20px; background: var(--surf);
    border: 1px solid var(--out); display: flex; align-items: center; justify-content: center;
  }
  .dots { display: flex; align-items: center; gap: 14px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--acc); }
  .dots i.empty { width: 9.8px; height: 9.8px; background: var(--out); }

  .pad { width: 355px; display: flex; flex-direction: column; gap: 10px; }
  .pad .row { display: flex; gap: 10px; }
  .key {
    flex: 1; height: 79.8px; border-radius: 40px; background: var(--surf);
    display: flex; align-items: center; justify-content: center;
    /* The app uses FontFamily.Monospace, which on Android is Roboto Mono — a grotesque with
       a plain zero. macOS only ships SF Mono, whose zero is slashed and reads as a typo at
       this size, so the digits use tabular sans instead. */
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 500;
    color: var(--on);
  }
  .key.blank { background: transparent; }
</style>
