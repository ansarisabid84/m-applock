<!--
  Screenshot 5 — the Vault tab (ui/vault/VaultScreen.kt).

  From that file: 20dp/12dp header padding, "Vault" as headlineMedium, the subtitle
  "N items · AES-256-GCM, key held in secure hardware" in bodyMedium/onSurfaceVariant, a
  GridCells.Adaptive(108.dp) grid with 16dp content padding and 8dp gaps (three columns at
  411dp wide), square 14dp-radius cells, and an ExtendedFloatingActionButton labelled "Add"
  in primary/onPrimary. Non-image kinds fall back to a 28dp glyph, which is why the video,
  audio and document cells look the way they do.

  Cell contents are abstract, not photographs — the point of the screen is that the bytes on
  disk are ciphertext, and no real file needs to be exposed to show that.
-->

  .cell {
    aspect-ratio: 1; border-radius: 14px; background: var(--surf); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .fab {
    position: absolute; right: 16px; bottom: 16px; height: 56px; border-radius: 16px;
    background: var(--acc); color: var(--onprim); display: flex; align-items: center;
    gap: 8px; padding: 0 20px; font-size: 14px; font-weight: 500; letter-spacing: 0.2px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
  }
</style>
