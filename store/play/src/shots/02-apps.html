<!--
  Screenshot 2 — the Apps tab (ui/home/HomeScreen.kt).

  Straight off the source: 20dp side padding, "Protected apps" as headlineMedium, the
  "N locked" subtitle in onSurfaceVariant, a 56dp OutlinedTextField with a 16dp radius and
  the placeholder "Search apps", the two-group FilterBar (All/Locked/Unlocked | Any/Installed/
  System) with a 1x22dp divider between the groups, the bulk Lock/Unlock chips at
  primary.copy(alpha = 0.14f), and AppRow — 18dp radius, 44dp icon box at 14dp radius,
  subtitle "Locked" in primary or "Not locked" in onSurfaceVariant, trailing Switch.

  App names and glyphs are generic. ProtectionBanner is absent because it returns early when
  nothing is wrong, which is what a healthy install looks like.
-->

<style>
  .head { padding: 12px 20px 8px; }
  .search {
    height: 56px; border-radius: 16px; background: var(--surf);
    border: 1px solid rgba(231,233,236,0.12);
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    font-size: 15px; color: var(--onsv);
  }
  .pills { display: flex; align-items: center; gap: 8px; }
  .pill {
    border-radius: 12px; background: var(--surf); padding: 8px 14px;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 14px; font-weight: 500; letter-spacing: 0.2px; color: var(--onsv);
  }
  .pill.sel { background: var(--acc); color: var(--onprim); }
  .pill b { font-size: 12px; font-weight: 500; opacity: 0.6; }
  .pill.sel b { opacity: 0.75; }
  .vr { width: 1px; height: 22px; margin: 0 2px; background: rgba(231,233,236,0.12); }

  .bulk { display: flex; gap: 8px; }
  .chip {
    border-radius: 12px; background: rgba(127,168,217,0.14); padding: 8px 14px;
    display: flex; align-items: center; gap: 7px;
    font-size: 14px; font-weight: 500; letter-spacing: 0.2px; color: var(--acc);
  }

  .list { flex: 1; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .row {
    border-radius: 18px; background: var(--surf); padding: 10px 12px;
    display: flex; align-items: center; flex: 0 0 auto;
  }
  .ibox {
    width: 44px; height: 44px; border-radius: 14px; background: rgba(32,38,46,0.5);
    display: flex; align-items: center; justify-content: center; margin-right: 14px;
  }
  .row .txt { flex: 1; }
</style>
